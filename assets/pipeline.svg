<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="210" viewBox="0 0 1200 210" role="img" aria-labelledby="t d">
<title id="t">How I work: capture, model, connect, operate, improve</title>
<desc id="d">Five-step pipeline from reality capture to model, connected data, operations and continuous improvement.</desc>
<defs>
<style>
