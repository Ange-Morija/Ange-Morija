<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270" role="img" aria-labelledby="t d">
<title id="t">Career path</title>
<desc id="d">Timeline: civil engineering at ESTP Paris, structural monitoring at SOCOTEC Monitoring, surveying and 3D at QUARTA, smart lighting and tunnels at Comatelec Schréder, building operations performance at Artelia, towards Smart City Solution Architect.</desc>
<defs>
